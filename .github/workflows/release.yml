name: Build & Release (APK & IPA)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android (APK & AAB)'
        required: true
        type: boolean
        default: true
      build_ios:
        description: 'Build iOS (Unsigned IPA)'
        required: true
        type: boolean
        default: true
      create_release:
        description: 'Publish GitHub Release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android (APK & AAB)
    if: github.event_name == 'push' || inputs.build_android == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android NDK (r27b)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b
          link-to-sdk: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Detect Project Directory
        id: proj
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "path=." >> $GITHUB_OUTPUT
          elif [ -f "locallm/pubspec.yaml" ]; then
            echo "path=locallm" >> $GITHUB_OUTPUT
          else
            echo "path=." >> $GITHUB_OUTPUT
          fi

      - name: Install Dependencies
        working-directory: ${{ steps.proj.outputs.path }}
        run: flutter pub get

      - name: Build Release APK
        working-directory: ${{ steps.proj.outputs.path }}
        run: flutter build apk --release

      - name: Build Release App Bundle (AAB)
        working-directory: ${{ steps.proj.outputs.path }}
        run: flutter build appbundle --release

      - name: Stage Android Artifacts
        run: |
          PROJ="${{ steps.proj.outputs.path }}"
          mkdir -p artifacts-android
          cp "$PROJ/build/app/outputs/flutter-apk/app-release.apk" artifacts-android/locallm-release.apk
          cp "$PROJ/build/app/outputs/bundle/release/app-release.aab" artifacts-android/locallm-release.aab

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-builds
          path: artifacts-android/
          retention-days: 7

  build-ios:
    name: Build iOS (Unsigned IPA)
    if: github.event_name == 'push' || inputs.build_ios == true
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Detect Project Directory
        id: proj
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "path=." >> $GITHUB_OUTPUT
          elif [ -f "locallm/pubspec.yaml" ]; then
            echo "path=locallm" >> $GITHUB_OUTPUT
          else
            echo "path=." >> $GITHUB_OUTPUT
          fi

      - name: Install CMake & Ninja
        run: brew install cmake ninja

      - name: Install Dependencies
        working-directory: ${{ steps.proj.outputs.path }}
        run: flutter pub get

      - name: Build libllama_ios for iOS arm64
        working-directory: ${{ steps.proj.outputs.path }}
        run: |
          if [ -f "local_plugins/llama_flutter_android/scripts/build_llama_ios.sh" ]; then
            chmod +x local_plugins/llama_flutter_android/scripts/build_llama_ios.sh
            bash local_plugins/llama_flutter_android/scripts/build_llama_ios.sh
          fi

      - name: Build iOS Application (No Codesign)
        working-directory: ${{ steps.proj.outputs.path }}
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          PROJ="${{ steps.proj.outputs.path }}"
          mkdir -p artifacts-ios/Payload
          cp -r "$PROJ/build/ios/iphoneos/Runner.app" artifacts-ios/Payload/
          cd artifacts-ios
          zip -r -9 locallm-ios-unsigned.ipa Payload
          rm -rf Payload
          cd ..

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-builds
          path: artifacts-ios/
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build-android, build-ios]
    if: (always() && !cancelled()) && (github.event_name == 'push' || inputs.create_release != false)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Release Directory
        run: mkdir -p release-assets

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-release-builds
          path: release-assets

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios-release-builds
          path: release-assets

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="release-$(date +'%Y%m%d-%H%M%S')"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "LocalLM Release ${{ steps.release_info.outputs.tag }}"
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
