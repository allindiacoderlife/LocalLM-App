name: locallm
description: "High-performance Private & Hybrid AI Client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Local DB / Persistence
  hive_flutter: ^1.1.0

  # Networking & Streaming
  dio: ^5.7.0
  http: ^1.2.2

  # Markdown & Rich Text
  flutter_markdown: ^0.7.4+1
  google_fonts: ^6.2.1

  # Utilities & Attachments
  uuid: ^4.5.1
  file_picker: ^11.0.2
  syncfusion_flutter_pdf: ^33.2.6
  intl: ^0.20.2
  path_provider: ^2.1.5
  device_info_plus: ^12.4.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  flutter_local_notifications: ^17.2.4
  liquid_glass_widgets: ^1.20.0

  # Local GGUF Engine & Cluster RPC
  llama_flutter_android:
    path: local_plugins/llama_flutter_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 28
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/ic_launcher_foreground.png"
  adaptive_icon_monochrome: "assets/icons/ic_launcher_monochrome.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

